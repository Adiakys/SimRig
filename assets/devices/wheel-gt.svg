<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Generic GT3-style steering wheel: rim cut flat at the top and bottom, arc grips at the
       sides, central panel with LEDs, buttons and rotaries (no display). Front view; rotates around (200,200). -->
  <defs>
    <linearGradient id="gtBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3e43"/>
      <stop offset="1" stop-color="#26282b"/>
    </linearGradient>
    <linearGradient id="gtGrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1e20"/>
      <stop offset="0.5" stop-color="#2c2e32"/>
      <stop offset="1" stop-color="#1d1e20"/>
    </linearGradient>
  </defs>
  <!-- paddles, behind the grips -->
  <g fill="#8f959b" stroke="#5d6268" stroke-width="1.2">
    <path d="M66 150l-30 -8 2 -14 32 4z"/>
    <path d="M334 150l30 -8 -2 -14 -32 4z"/>
  </g>
  <!-- body: a circle cut flat at the top and bottom, with two hand openings -->
  <path fill="url(#gtBody)" fill-rule="evenodd" stroke="#5d6268" stroke-width="1.5"
        d="M72 88H328A175 175 0 0 1 330 318H70A175 175 0 0 1 72 88Z
           M114 146H70A140 140 0 0 0 74 266H114Z
           M286 146H330A140 140 0 0 1 326 266H286Z"/>
  <!-- grips over the side arcs -->
  <path d="M68 112A158 158 0 0 0 74 296" fill="none" stroke="url(#gtGrip)" stroke-width="30" stroke-linecap="round"/>
  <path d="M332 112A158 158 0 0 1 326 296" fill="none" stroke="url(#gtGrip)" stroke-width="30" stroke-linecap="round"/>
  <g fill="none" stroke="#3a3c40" stroke-width="1.2">
    <path d="M53 150h28M50 176h30M50 202h30M50 228h30M53 254h28"/>
    <path d="M319 150h28M320 176h30M320 202h30M320 228h30M319 254h28"/>
  </g>
  <!-- top marker -->
  <rect x="192" y="88" width="16" height="14" rx="2" fill="#f0c53a"/>
  <!-- RPM LEDs -->
  <g>
    <circle cx="140" cy="114" r="5" fill="#3ccf6b"/><circle cx="155" cy="114" r="5" fill="#3ccf6b"/>
    <circle cx="170" cy="114" r="5" fill="#3ccf6b"/><circle cx="185" cy="114" r="5" fill="#ef5a4f"/>
    <circle cx="200" cy="114" r="5" fill="#ef5a4f"/><circle cx="215" cy="114" r="5" fill="#ef5a4f"/>
    <circle cx="230" cy="114" r="5" fill="#2e3034"/><circle cx="245" cy="114" r="5" fill="#2e3034"/>
    <circle cx="260" cy="114" r="5" fill="#2e3034"/>
  </g>
  <!-- central panel -->
  <rect x="122" y="130" width="156" height="170" rx="14" fill="#2a2c30" stroke="#4a4e54" stroke-width="1.2"/>
  <!-- top button row instead of a display -->
  <g fill="#4a4e54" stroke="#6b7076" stroke-width="1">
    <rect x="146" y="146" width="30" height="20" rx="6"/><rect x="185" y="146" width="30" height="20" rx="6"/><rect x="224" y="146" width="30" height="20" rx="6"/>
    <rect x="146" y="174" width="30" height="20" rx="6"/><rect x="185" y="174" width="30" height="20" rx="6"/><rect x="224" y="174" width="30" height="20" rx="6"/>
  </g>
  <rect x="185" y="146" width="30" height="20" rx="6" fill="none" stroke="#f0c53a" stroke-width="2" opacity="0.85"/>
  <g fill="#4a4e54" stroke="#6b7076" stroke-width="1">
    <circle cx="142" cy="208" r="10"/><circle cx="142" cy="236" r="10"/>
    <circle cx="258" cy="208" r="10"/><circle cx="258" cy="236" r="10"/>
    <circle cx="176" cy="208" r="8"/><circle cx="224" cy="208" r="8"/>
  </g>
  <g fill="none" stroke-width="2.2" opacity="0.85">
    <circle cx="142" cy="208" r="10" stroke="#3ccf6b"/>
    <circle cx="258" cy="208" r="10" stroke="#ef5a4f"/>
    <circle cx="142" cy="236" r="10" stroke="#4b9cf0"/>
  </g>
  <!-- rotaries and centre switch -->
  <circle cx="158" cy="272" r="17" fill="#1d1e20" stroke="#8f959b" stroke-width="2"/>
  <line x1="158" y1="272" x2="149" y2="258" stroke="#dfe2e4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="242" cy="272" r="17" fill="#1d1e20" stroke="#8f959b" stroke-width="2"/>
  <line x1="242" y1="272" x2="256" y2="265" stroke="#dfe2e4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="244" r="13" fill="#303236" stroke="#6b7076" stroke-width="1.5"/>
  <circle cx="200" cy="244" r="5" fill="#4a4e54"/>
  <!-- bottom edge detail -->
  <rect x="176" y="306" width="48" height="6" rx="3" fill="#1d1e20"/>
</svg>
