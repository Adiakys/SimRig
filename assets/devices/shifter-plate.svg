  <rect x="14" y="14" width="292" height="292" rx="34" fill="url(#sPlate)" stroke="#5d6268" stroke-width="1.5"/>
  <rect x="36" y="36" width="248" height="248" rx="22" fill="#232427" stroke="#3b3e43" stroke-width="1"/>
  <g fill="#8f959b" stroke="#5d6268" stroke-width="1">
