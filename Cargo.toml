[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# Until its adapter exists: for now the Fanatec plugin is only its driver.
exclude = ["plugins/fanatec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

simrig-driver = { path = "crates/simrig-driver" }
simrig-host = { path = "crates/simrig-host" }
simrig-model = { path = "crates/simrig-model" }
simrig-plugin-sdk = { path = "crates/simrig-plugin-sdk" }
simrig-protocol = { path = "crates/simrig-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The interface draws vector images on the CPU in some cases (software renderer): keep those
# crates fast in development builds too.
[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3
