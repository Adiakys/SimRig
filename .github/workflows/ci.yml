name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the GUI (Slint)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: GUI smoke test (offscreen, simulated rig)
        run: |
          cargo build --workspace
          mkdir -p target/shots
          for theme in light dark; do
            for screen in home component:base procedure:pedals/calibrate-brake plugins; do
              name=$(echo "$screen" | tr ':/' '--')
              timeout 60 ./target/debug/simrig --plugin-dir plugins/sim --no-default-dirs \
                --config-dir "$RUNNER_TEMP/simrig-$theme" --state-dir "$RUNNER_TEMP/simrig-state" \
                --screenshot "target/shots/$name-$theme.png" --theme "$theme" --screen "$screen"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: target/shots/*.png
