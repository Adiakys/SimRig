# Publish the public site (site/) on GitHub Pages: https://adiakys.github.io/SimRig/
#
# Needs Settings → Pages → Source: "GitHub Actions" (once).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/fonts/**
      - assets/devices/**
      - crates/simrig-gui/ui/icons/mark.svg
      - scripts/site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Shared assets (fonts, the mark, the device drawings)
        run: scripts/site.sh stage
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
