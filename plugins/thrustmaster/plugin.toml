id = "thrustmaster"
name = "Thrustmaster"
version = "0.1.0"
api = 1
exec = "simrig-plugin-thrustmaster"
driver = "driver/driver.toml"
description = "Thrustmaster wheels: T300 RS, T248, T128, TX, TS-PC, TS-XW, T-GT II, on the open source hid-tmff2 driver."

# The wheels of src/models.rs; a test keeps them in step with hid-tmff2 and hid-tminit.
[match]
usb = [
    { vid = 0x044f, pid = 0xb66e }, # T300 RS
    { vid = 0x044f, pid = 0xb66f }, # T300 RS (advanced mode)
    { vid = 0x044f, pid = 0xb66d }, # T300 RS (PS4 mode)
    { vid = 0x044f, pid = 0xb696 }, # T248
    { vid = 0x044f, pid = 0xb669 }, # TX Racing Wheel
    { vid = 0x044f, pid = 0xb689 }, # TS-PC Racer
    { vid = 0x044f, pid = 0xb692 }, # TS-XW Racer
    { vid = 0x044f, pid = 0xb65d }, # a wheel starting up
    { vid = 0x044f, pid = 0xb664 }, # a wheel starting up
    { vid = 0x044f, pid = 0xb69c }, # a wheel starting up
    { vid = 0x044f, pid = 0xb691 }, # a wheel starting up
    { vid = 0x044f, pid = 0xb6a5 }, # a wheel starting up
]
