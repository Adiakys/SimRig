# SimRig's DKMS configuration for hid-t150: upstream's expects its install script to copy
# dkms_make.mak as the Makefile first. PACKAGE_NAME and PACKAGE_VERSION are set when installed.
PACKAGE_NAME=hid-t150
PACKAGE_VERSION=0
MAKE[0]="make -f dkms_make.mak KDIR=${kernel_source_dir} all"
CLEAN="make -f dkms_make.mak KDIR=${kernel_source_dir} clean"
BUILT_MODULE_NAME[0]=hid-t150
BUILT_MODULE_LOCATION[0]="build/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hid"
AUTOINSTALL=yes
