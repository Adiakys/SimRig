id = "moza"
name = "Moza"
version = "0.1.0"
api = 1
exec = "simrig-plugin-moza"
driver = "driver/driver.toml"
# Confirmed on real hardware; the app marks the other models as untested.
tested = ["moza/r21-ultra-base", "moza/crp2-pedals", "moza/hbp-handbrake", "moza/sgp-shifter"]
description = "Moza wheel bases and their rims, pedals, handbrakes and shifters: force feedback through the kernel, settings over their serial port."

# Moza does not publish its product ids: every device of the vendor, told apart by its name.
[match]
usb = [{ vid = 0x346e }]
