[package]
name = "simrig-plugin-moza"
description = "simrig plugin for Moza devices: forces through the kernel, settings over their serial port"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "simrig-plugin-moza"
path = "src/bin/adapter.rs"

[dependencies]
rustix = { version = "1", features = ["fs", "termios"] }
simrig-plugin-kit.workspace = true
simrig-plugin-sdk.workspace = true

[dev-dependencies]
serde_json.workspace = true
simrig-driver = { workspace = true, features = ["testing"] }
simrig-host = { workspace = true, features = ["testing"] }
simrig-model.workspace = true

[lints]
workspace = true
