[package]
name = "simrig-plugin-simagic"
description = "simrig plugin for Simagic wheel bases, on the simagic-ff driver (bundled, built with DKMS)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "simrig-plugin-simagic"
path = "src/bin/adapter.rs"

[dependencies]
simrig-plugin-kit.workspace = true
simrig-plugin-sdk.workspace = true

[dev-dependencies]
simrig-driver = { workspace = true, features = ["testing"] }
simrig-host = { workspace = true, features = ["testing"] }
simrig-model.workspace = true

[lints]
workspace = true
