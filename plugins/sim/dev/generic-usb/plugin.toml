# Development only: a generic plugin made from the simulated rig. It handles the USB devices the
# user assigns to it, to exercise the add-device flow (see scripts/dev-gui.sh).
id = "sim-generic"
name = "Simulated generic USB"
version = "0.1.0"
api = 1
exec = "simrig-plugin-sim"
args = ["--id", "sim-generic", "--devices", "", "--usb-generic"]
description = "Sets up any USB device as a shifter or a handbrake (simulated)."

[match]
on_request = true
