# The standard force feedback driver: SimRig's udev rules, which give the logged-in user the
# bases' inputs and force feedback, and hid-universal-pidff for kernels older than 6.15 (bundled
# as a git submodule, pinned to a tested version, built with DKMS). The kernel's own
# hid-universal-pidff, or one installed by other means (for example by SimRig's Moza or PXN
# driver), is used as it is. The OpenFFBoard needs none: the kernel's generic driver drives it.
id = "pidff"
name = "universal-pidff"
version = "0.2.2-6-gefd9b4a"
summary = "udev rules for the bases' inputs, and hid-universal-pidff for kernels older than 6.15"
license = "GPL-2.0 (universal-pidff), GPL-3.0-or-later (SimRig's hooks)"
# Upstream projects of the bundled sources, linked from Plugins.
sources = [{ name = "universal-pidff", url = "https://github.com/JacKeTUs/universal-pidff" }]

install = "hooks/install"
uninstall = "hooks/uninstall"
status = "hooks/status"

# Needed only to build hid-universal-pidff, on kernels older than 6.15.
requires = ["dkms", "kernel-headers", "build-tools"]
