id = "logitech"
name = "Logitech"
version = "0.1.0"
api = 1
exec = "simrig-plugin-logitech"
driver = "driver/driver.toml"
description = "Logitech wheels: G29, G27, G25, Driving Force, G920, G923 on the kernel's drivers (with new-lg4ff for more effects), G PRO and RS50 on the TrueForce driver, the oldest WingMan wheels."

# The wheels of src/models.rs; a test keeps the two in step.
[match]
usb = [
    { vid = 0x046d, pid = 0xc20e }, # WingMan Formula GP
    { vid = 0x046d, pid = 0xc291 }, # WingMan Formula Force
    { vid = 0x046d, pid = 0xc293 }, # WingMan Formula Force GP
    { vid = 0x046d, pid = 0xc294 }, # Driving Force
    { vid = 0x046d, pid = 0xc295 }, # MOMO Racing
    { vid = 0x046d, pid = 0xc298 }, # Driving Force Pro
    { vid = 0x046d, pid = 0xc299 }, # G25 Racing Wheel
    { vid = 0x046d, pid = 0xc29a }, # Driving Force GT
    { vid = 0x046d, pid = 0xc29b }, # G27 Racing Wheel
    { vid = 0x046d, pid = 0xc29c }, # Speed Force Wireless
    { vid = 0x046d, pid = 0xca03 }, # MOMO Racing
    { vid = 0x046d, pid = 0xc24f }, # G29 Driving Force
    { vid = 0x046d, pid = 0xc266 }, # G923 Racing Wheel (PlayStation)
    { vid = 0x046d, pid = 0xc267 }, # G923 Racing Wheel (PlayStation)
    { vid = 0x046d, pid = 0xc262 }, # G920 Driving Force
    { vid = 0x046d, pid = 0xc26d }, # G923 Racing Wheel (Xbox)
    { vid = 0x046d, pid = 0xc26e }, # G923 Racing Wheel (Xbox)
    { vid = 0x046d, pid = 0xc268 }, # G PRO Racing Wheel (PlayStation)
    { vid = 0x046d, pid = 0xc272 }, # G PRO Racing Wheel
    { vid = 0x046d, pid = 0xc276 }, # RS50 Direct Drive Wheel Base
]
